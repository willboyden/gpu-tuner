name: format
on: [push, pull_request]
# Prettier (the exact version in package-lock.json, installed with `npm ci`) checks that the code and JSON files are
# formatted; .prettierignore lists what it leaves alone. Development only: gpu-tuner itself needs no Node.
# Actions are pinned to the commit of a release (a tag can be moved); the comment names the release.
permissions:
  contents: read
jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run fmt:check
